name: Feature request
description: Propose a new capability or improvement for Janus
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check that it fits Janus's scope (broker surface,
        registry, policy, credential isolation, sanitizer, audit) — see CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that Janus makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Janus to do? Sketch the tool/behavior if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why they fall short.
    validations:
      required: false
