name: Bug report
description: Something in Janus behaves incorrectly
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please search existing issues first.
        **Do not report security vulnerabilities here** — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I call capability.describe(...), Janus returns ... but I expected ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, config, or a broker call sequence that triggers it.
      placeholder: |
        1. Register downstream server X
        2. Call capability.search("...")
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD` or the release you are on.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any secrets, tokens, or private hostnames before pasting.
      render: shell
    validations:
      required: false
