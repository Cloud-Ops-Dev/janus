name: Documentation issue
description: Something in the docs is missing, wrong, or unclear
labels: ["type/docs"]
body:
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Which doc/section (file path, README heading, or URL)?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing
      description: Describe the gap, error, or confusion — and what would make it clear.
    validations:
      required: true
