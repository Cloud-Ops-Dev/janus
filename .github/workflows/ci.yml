name: ci

# Mirrors the local CRM gates (ruff / mypy --strict / pytest) so pull requests
# from external contributors — who cannot run the private CRM pipeline — are
# verified the same way. This is the status check required by branch protection.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy --strict)
        run: mypy src
      - name: Test (pytest)
        run: python -m pytest tests/ -x -q
